name: FootballPerformance

options:
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  FootballPerformanceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Watch
      - path: Sources/Shared/SessionFoundation
      - path: Resources/Watch/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: CryptoKit.framework
      - sdk: WatchConnectivity.framework
    entitlements:
      path: Entitlements/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance.watchapp
        DEVELOPMENT_TEAM: 4JRB53LG5C
        PRODUCT_NAME: Football Performance Watch
        PRODUCT_MODULE_NAME: FootballPerformanceWatch
        INFOPLIST_FILE: Resources/Watch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: 1.0.1
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FootballPerformance:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/iOS
      - path: Sources/Shared/SessionFoundation
      - path: Resources/iOS/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: FootballPerformanceWatch
        embed: true
        link: false
      - sdk: Charts.framework
      - sdk: CryptoKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance
        DEVELOPMENT_TEAM: 4JRB53LG5C
        PRODUCT_NAME: Football Performance
        PRODUCT_MODULE_NAME: FootballPerformance
        INFOPLIST_FILE: Resources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 12
        MARKETING_VERSION: 1.0.1
        SKIP_INSTALL: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FootballPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/SessionFoundation
      - path: Tests/PhoneImport
    dependencies:
      - target: FootballPerformance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Football Performance.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Football Performance"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FootballPerformanceWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/WatchTransfer
    dependencies:
      - target: FootballPerformanceWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance.watchtests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Football Performance Watch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Football Performance Watch"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FootballPerformanceWatch:
    build:
      targets:
        FootballPerformanceWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FootballPerformanceWatchTests
    archive:
      config: Release

  FootballPerformance:
    build:
      targets:
        FootballPerformance: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FootballPerformanceTests
    archive:
      config: Release

  FootballPerformanceTests:
    build:
      targets:
        FootballPerformanceTests: all
    test:
      config: Debug
      targets:
        - FootballPerformanceTests

  FootballPerformanceWatchTests:
    build:
      targets:
        FootballPerformanceWatchTests: all
    test:
      config: Debug
      targets:
        - FootballPerformanceWatchTests
