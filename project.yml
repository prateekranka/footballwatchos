name: FootballPerformance

options:
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  FootballPerformanceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Watch
      - path: Sources/Shared/SessionFoundation
      - path: Resources/Watch/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: CryptoKit.framework
      - sdk: WatchConnectivity.framework
    entitlements:
      path: Entitlements/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance.watchapp
        DEVELOPMENT_TEAM: 4JRB53LG5C
        PRODUCT_NAME: Football Performance Watch
        PRODUCT_MODULE_NAME: FootballPerformanceWatch
        INFOPLIST_FILE: Resources/Watch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 35
        MARKETING_VERSION: 1.0.1
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution: Esha Bhoon (4JRB53LG5C)"
          PROVISIONING_PROFILE_SPECIFIER: "FootballPerformance b28 Watch Distribution"

  FootballPerformance:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/iOS
      - path: Sources/Shared/SessionFoundation
      - path: Resources/iOS/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: FootballPerformanceWatch
        embed: true
        link: false
      - sdk: Charts.framework
      - sdk: CryptoKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance
        DEVELOPMENT_TEAM: 4JRB53LG5C
        PRODUCT_NAME: Football Performance
        PRODUCT_MODULE_NAME: FootballPerformance
        INFOPLIST_FILE: Resources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 35
        MARKETING_VERSION: 1.0.1
        SKIP_INSTALL: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution: Esha Bhoon (4JRB53LG5C)"
          PROVISIONING_PROFILE_SPECIFIER: "FootballPerformance b28 iOS Distribution"

  FootballPerformanceE2E:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/E2E
    dependencies:
      - target: FootballPerformance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance.e2e
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FootballPerformance

  FootballPerformanceWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/WatchUI
    dependencies:
      - target: FootballPerformanceWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.footballperformance.watchuitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FootballPerformanceWatch
        DEVELOPMENT_TEAM: 4JRB53LG5C

schemes:
  FootballPerformanceWatchUITests:
    build:
      targets:
        FootballPerformanceWatch: all
        FootballPerformanceWatchUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      debugEnabled: false
      targets:
        - name: FootballPerformanceWatchUITests
          parallelizable: false
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true

  FootballPerformanceWatch:
    build:
      targets:
        FootballPerformanceWatch: all
    run:
      config: Debug
    archive:
      config: Release

  FootballPerformance:
    build:
      targets:
        FootballPerformance: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FootballPerformanceE2E
    archive:
      config: Release

  FootballPerformanceE2E:
    build:
      targets:
        FootballPerformanceE2E: all
    test:
      config: Debug
      targets:
        - name: FootballPerformanceE2E
          parallelizable: false

